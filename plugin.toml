schema_version = 1

[plugin]
id          = "prowlarr"
name        = "Prowlarr"
version     = "1.0.0"
description = "Holds your indexer accounts in one place and shares them with everything else"
without_it  = "Every app needs indexers configured separately"
upstream    = "https://github.com/Prowlarr/Prowlarr"
license     = "GPL-3.0-only"
forms       = ["search", "hunt", "tv", "movies", "music", "books", "auto", "full"]

[[service]]
id          = "prowlarr"
name        = "Prowlarr"
image       = "lscr.io/linuxserver/prowlarr"
digest      = "sha256:4e992f9b9229bc8c97c666b10b042a7360bce1d99b196e8aa29fd9805849cbf1"
tag         = "2.6.5.5623-ls164"
port        = 9696
bind        = "loopback"
listens     = 9696
health      = { kind = "http", path = "/ping", timeout_s = 60 }
criticality = "core"
memory_mib  = 200
reaches     = "the indexers you configured"
asks_for    = "Runs the searches everything else asks for, and reads each indexer's capabilities and remaining allowance, authenticating with the keys you gave it."
takes_data  = true
user_mode   = "puid-env"
native      = "servarr"
replaces    = "prowlarr"

[service.env]
PROWLARR__AUTH__APIKEY = { secret = "upstream-key" }

[[service]]
id          = "prowlarr-adapter"
name        = "Prowlarr adapter"
image       = "ghcr.io/lemonfiber/prowlarr-adapter"
digest      = "sha256:f7248ace93c48be62cf3c718c72d1c663ab90efab9c4ebf755326e5e2b9954c9"
tag         = "main-e1702f28d02a"
criticality = "core"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's indexer.search contract by calling Prowlarr, beside it, with the key lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["indexer.search@1"]
fronts      = "prowlarr"
provides    = ["indexer.search"]
upstream    = { api_key = { secret = "upstream-key" } }

[[secret]]
id     = "upstream-key"
of     = "prowlarr"
minted = true
why    = "The key Prowlarr answers its API to, which the adapter in front of it presents"
carried_from = { file = "/config/config.xml", format = "xml", key = "Config.ApiKey" }

[[proof]]
id      = "prowlarr.answers"
service = "prowlarr"
title   = "Prowlarr says it answers to anybody"
fixture = "recordings/prowlarr/ping-answers.json"
why     = """
The adapter's readiness is this answer, which it asks without a key, so the
pinned image has to give it to a caller presenting nothing.
"""
request = { method = "GET", path = "/ping" }
expect  = { status = 200, json = { status = "OK" } }

[[proof]]
id      = "prowlarr.guarded"
service = "prowlarr"
title   = "Prowlarr lists its indexers to nobody presenting nothing"
fixture = "recordings/prowlarr/indexers-guarded.json"
why     = """
The indexers name the household's accounts and where it searches. Only the
adapter asks, with the key lemonfiber minted, so a Prowlarr that listed them to
a caller presenting nothing would be telling every device that can reach it.
"""
request = { method = "GET", path = "/api/v1/indexer" }
expect  = { status = 401 }

[[ask]]
service    = "prowlarr"
capability = "library.curate"
each       = true

[[ask]]
service    = "prowlarr"
capability = "indexer.proxy"

[[ask]]
service    = "prowlarr"
capability = "dashboard.show"
